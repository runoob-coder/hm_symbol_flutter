<!doctype html>
<html lang="en">
  <head>
    <base href="$FLUTTER_BASE_HREF" />

    <meta charset="UTF-8" />
    <meta content="IE=Edge" http-equiv="X-UA-Compatible" />
    <meta
      name="description"
      content="Browse and search nearly 4,000 HarmonyOS Symbol icons for Flutter."
    />
    <meta name="theme-color" content="#007DFF" />

    <meta content="yes" name="apple-mobile-web-app-capable" />
    <meta content="black" name="apple-mobile-web-app-status-bar-style" />
    <meta content="HarmonyOS Symbol" name="apple-mobile-web-app-title" />

    <link href="manifest.json" rel="manifest" />

    <title>HarmonyOS Symbol</title>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #f5f5f7;
        color: #1a1a1a;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }

      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #16171a;
          color: #f2f2f2;
        }
      }

      .loading {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        gap: 16px;
        align-items: center;
        justify-content: center;
      }

      .loading h1 {
        margin: 0;
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.2px;
      }

      .spinner {
        width: 32px;
        height: 32px;
        border: 3px solid rgba(127, 127, 127, 0.25);
        border-top-color: #007dff;
        border-radius: 50%;
        animation: spin 0.9s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="loading" id="loading">
      <h1>HarmonyOS Symbol</h1>
      <div class="spinner"></div>
    </div>

    <script src="flutter_bootstrap.js" async></script>
    <script>
      // Remove the splash once Flutter rendered its first frame.
      window.addEventListener("flutter-first-frame", function () {
        document.getElementById("loading")?.remove();
      });
    </script>
  </body>
</html>
